<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mitsukaru</title>
<style>
:root{--bg:#f4f3ef;--card:#ffffff;--text:#1c2228;--muted:#5d6670;--accent:#1c2228;--star:#c98a12}
@media (prefers-color-scheme:dark){:root{--bg:#15191d;--card:#1e2328;--text:#eceee9;--muted:#9aa3ad;--accent:#eceee9;--star:#e3a83a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);width:100%;max-width:400px;border-radius:18px;padding:32px 24px;text-align:center}
.stars{font-size:26px;letter-spacing:4px;color:var(--star)}
h1{font-size:20px;margin:14px 0 6px}p{margin:0;color:var(--muted);font-size:15px}
.btn{display:inline-block;margin-top:20px;color:var(--accent);font-weight:600;font-size:15px}
</style>
</head>
<body>
<main class="card">
<div class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
<h1>Einen Moment &hellip;</h1>
<p>Sie werden weitergeleitet.</p>
<a class="btn" id="weiter" href="/frei.html">Weiter</a>
</main>
<script>
/*
  Router fuer alle QR-Codes und NFC-Tags.
  Ein Code sieht so aus: mitsukaru.de/r/001
  Die Zuordnung Code -> Kunde steht in kunden.json (nicht hier).
*/
(function () {
  // Optionales Klick-Tracking mit GoatCounter. Leer lassen = aus.
  var GOATCOUNTER = "";

  var path = location.pathname.replace(/\/+$/, "");
  var m = path.match(/^\/r\/([A-Za-z0-9_-]+)$/);
  var code = m ? m[1] : null;

  function weiter(ziel) {
    document.getElementById("weiter").href = ziel;
    if (GOATCOUNTER && code) {
      var fertig = false, los = function () { if (!fertig) { fertig = true; location.replace(ziel); } };
      var img = new Image();
      img.onload = los; img.onerror = los; img.referrerPolicy = "no-referrer";
      img.src = "https://" + GOATCOUNTER + ".goatcounter.com/count?p=/r/" + code + "&t=" + encodeURIComponent("Code " + code) + "&rnd=" + Math.random().toString(36).slice(2);
      setTimeout(los, 700);
    } else {
      location.replace(ziel);
    }
  }

  if (!code) { location.replace("/"); return; }

  fetch("/kunden.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (kunden) {
      var k = kunden[code];
      if (k && k.placeId) {
        weiter("https://search.google.com/local/writereview?placeid=" + encodeURIComponent(k.placeId));
      } else {
        weiter("/frei.html?code=" + encodeURIComponent(code));
      }
    })
    .catch(function () { weiter("/frei.html?code=" + encodeURIComponent(code)); });
})();
</script>
</body>
</html>
